# Run with: python3 sim/runner.py experiments/gemv.toml --run-id gemv-baseline

[experiment]
name = "gemv"

[[runs]]
mode = "pim"
gem5_config = "sim/gem5_scripts/mul_acc.py"
cases = [[128, 128], [512, 512], [1024, 2048], [2048, 4096], [4096, 8192]]
environment = { M = "1", N = "{rows}", K = "{cols}", PRINT_RESULT = "0" }

[[runs]]
mode = "openblas"
gem5_config = "sim/gem5_scripts/openblas_fp16_sve_gemm.py"
cases = [[128, 128], [512, 512], [1024, 2048], [2048, 4096], [4096, 8192]]
environment = { M = "1", N = "{rows}", K = "{cols}", PRINT_RESULT = "0" }
